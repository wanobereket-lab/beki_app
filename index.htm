<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 6 - JavaScript Basics</title>
</head>
<body>

    <h1>JavaScript Basics</h1>

    <h2>Welcome to my JavaScript journey!</h2>

    <p id="output"></p>

    <button onclick="showMessage()">Click Me</button>

    <script>
        // Variables
        let name = "Bereket";
        let age = 22;
        let isLearning = true;

        // Display variables
        console.log(name);
        console.log(age);
        console.log(isLearning);

        // Function
        function greet() {
            return "Hello, my name is " + name;
        }

        // Condition
        if (age >= 18) {
            console.log("You are an adult.");
        } else {
            console.log("You are under 18.");
        }

        // Array
        let skills = ["HTML", "CSS", "JavaScript"];

        console.log(skills);

        // Loop
        for (let i = 0; i < skills.length; i++) {
            console.log(skills[i]);
        }

        // Button function
        function showMessage() {
            document.getElementById("output").textContent =
                greet() + ". I am learning JavaScript!";
        }
    </script>

</body>
</html>
