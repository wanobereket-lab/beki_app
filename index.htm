<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Modern Navbar</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <header>

        <nav class="navbar">

            <a href="#" class="logo">
                BEREKET<span>.</span>
            </a>


            <button
                class="menu-button"
                id="menuButton"
                aria-label="Open navigation menu"
            >
                ☰
            </button>


            <ul class="nav-links" id="navLinks">

                <li>
                    <a href="#home">
                        Home
                    </a>
                </li>

                <li>
                    <a href="#about">
                        About
                    </a>
                </li>

                <li>
                    <a href="#services">
                        Services
                    </a>
                </li>

                <li>
                    <a href="#projects">
                        Projects
                    </a>
                </li>

                <li>
                    <a href="#contact">
                        Contact
                    </a>
                </li>

            </ul>

        </nav>

    </header>


    <main>

        <section id="home">

            <h1>
                Modern Navigation
            </h1>

            <p>
                Resize your browser to test the responsive menu.
            </p>

        </section>


        <section id="about">
            <h2>About</h2>
            <p>Welcome to my website.</p>
        </section>


        <section id="services">
            <h2>Services</h2>
            <p>Web development and design.</p>
        </section>


        <section id="projects">
            <h2>Projects</h2>
            <p>My latest projects.</p>
        </section>


        <section id="contact">
            <h2>Contact</h2>
            <p>Let's work together.</p>
        </section>

    </main>


    <script>

        const menuButton =
            document.getElementById("menuButton");

        const navLinks =
            document.getElementById("navLinks");


        menuButton.addEventListener("click", function () {

            navLinks.classList.toggle("active");

        });


        document
            .querySelectorAll(".nav-links a")
            .forEach(function (link) {

                link.addEventListener("click", function () {

                    navLinks.classList.remove("active");

                });

            });

    </script>

</body>

</html>
